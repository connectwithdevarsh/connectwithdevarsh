<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Animated arc reactor HUD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#7BE7FF"/>
      <stop offset="100%" stop-color="#7BE7FF" stop-opacity="0.25"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7BE7FF" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7BE7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7BE7FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7BE7FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="260" rx="18"/></clipPath>
  </defs>

  <rect width="800" height="260" rx="18" fill="#080304"/>
  <rect width="800" height="260" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="798" height="258" rx="17" fill="none" stroke="#8F111A" stroke-width="2"/>
  <path d="M16 44V16H44M756 16H784V44M784 216V244H756M44 244H16V216" fill="none" stroke="#F5C04A" stroke-width="3"/>

  <g clip-path="url(#frame)">
    <rect y="0" width="120" height="260" fill="url(#scan)">
      <animate attributeName="x" from="-120" to="800" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(400 128)" filter="url(#glow)">
    <circle r="98" fill="none" stroke="#8F111A" stroke-width="2" opacity="0.9"/>
    <circle r="88" fill="none" stroke="#7BE7FF" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="none" stroke="#F5C04A" stroke-width="4" stroke-dasharray="40 18 8 18">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(0)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(36)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(72)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(108)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(144)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(180)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(216)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(252)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(288)"/>
      <rect x="-7" y="-62" width="14" height="18" rx="3" fill="#D7262E" transform="rotate(324)"/>
    </g>
    <circle r="40" fill="none" stroke="#7BE7FF" stroke-width="3"/>
    <circle r="29" fill="#080304" stroke="#7BE7FF" stroke-width="2"/>
    <circle r="20" fill="url(#core)">
      <animate attributeName="r" values="18;23;18" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Courier New, Courier, monospace" font-size="15" fill="#7BE7FF">
    <text x="48" y="98">&gt; J.A.R.V.I.S: ONLINE</text>
    <text x="48" y="128" fill="#F5C04A">&gt; ARC REACTOR: 100%
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="158">&gt; USER: DEVARSH</text>
    <text x="752" y="98" text-anchor="end">FULL-STACK //</text>
    <text x="752" y="128" text-anchor="end" fill="#F5C04A">FLUTTER //
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </text>
    <text x="752" y="158" text-anchor="end">AI BUILDER //</text>
  </g>
  <text x="400" y="250" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" fill="#F5C04A" opacity="0.8">MARK INFINITY // ALWAYS UPGRADING</text>
</svg>
