<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" role="img" aria-label="Animated divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#D7262E" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#D7262E"/>
      <stop offset="0.5" stop-color="#F5C04A"/>
      <stop offset="0.75" stop-color="#D7262E"/>
      <stop offset="1" stop-color="#D7262E" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="800" height="2" fill="url(#g)"/>
  <path d="M388 12L400 4L412 12L400 20Z" fill="#080304" stroke="#F5C04A" stroke-width="2"/>
  <circle cx="400" cy="12" r="3" fill="#7BE7FF" filter="url(#glow)">
    <animate attributeName="r" values="2;4;2" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="12" r="3" fill="#7BE7FF" filter="url(#glow)">
    <animate attributeName="cx" values="0;800" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
